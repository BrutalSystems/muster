name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The npm that packs the tarball, pinned so the same commit packs the same way
# here, in the publish job, and on a laptop. npm's forced-inclusion rules are
# where versions drift: Tin Can shipped a file under npm 10 that npm 12 left
# out, from one commit. publish.yml pins the SAME version — bump both together,
# and see RELEASING.md.
#
# Deliberately not applied to the matrix below: that job proves the engines
# floor, and forcing npm 12 onto the Node 22 leg would stop exercising the npm
# a Node 22 user actually has.
env:
  NPM_VERSION: "12.0.2"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - run: npm test

  # Separate from the matrix because it pins npm: the tarball has to be packed
  # by the version that publishes it, not by whatever each Node leg bundles.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Before npm ci, so the lockfile is resolved by the same npm that packs.
      - name: Pin npm
        run: |
          npm install -g npm@${{ env.NPM_VERSION }}
          npm -v

      - run: npm ci

      # Node-version independent, so it runs here once rather than on every leg
      # of the matrix. Without it a type error in a test is reported by nothing:
      # tsconfig.json is scoped to src/, and Vitest strips types without
      # checking them (#74).
      - name: Typecheck, including the suite
        run: npm run typecheck

      # The same check publish.yml runs, on every push — so tarball drift
      # surfaces when it is introduced rather than at release time.
      # The same script `npm run check` runs locally, so the local gate and
      # this job cannot disagree about what "verified" means.
      - name: Tarball drift check
        run: node scripts/check-tarball.mjs
